name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore LAB_PI_4.sln

      - name: Build
        run: dotnet build LAB_PI_4.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LAB_PI_4.sln --configuration Release --no-build --verbosity normal

      - name: Publish client
        run: dotnet publish src/TaskBoard.Client/TaskBoard.Client.csproj --configuration Release --no-build --output artifacts/client

      - name: Publish server
        run: dotnet publish src/TaskBoard.Server/TaskBoard.Server.csproj --configuration Release --no-build --output artifacts/server

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: team-task-board-${{ matrix.os }}
          path: artifacts

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build docs
        run: docfx docs/docfx.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy-docs:
    name: Deploy documentation
    needs: docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
